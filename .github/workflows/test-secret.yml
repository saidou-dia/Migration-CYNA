name: Test Secret Azure

on:
  push:
    branches:
      - master

jobs:
  test-azure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: List Azure Resource Groups
        run: az group list -o table

      - name: Debug secret
        run: echo "${{ secrets.AZURE_CREDENTIALS }}" | head -c 100

